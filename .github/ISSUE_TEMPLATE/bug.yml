name: Bug report
description: Сообщить об ошибке в коде, сборке или запуске
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Сначала сверьтесь с `docs/KNOWN_ISSUES.md` и `docs/RUNBOOK.md`.
        Не прикладывайте чужие ассеты и охраняемые материалы (см. `docs/IP_SAFETY.md`).

  - type: textarea
    id: summary
    attributes:
      label: Краткое описание
      description: Что происходит и почему это ошибка.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Запустить...
        2. Нажать...
        3. Увидеть...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Текст ошибки, стек, скриншот, последние строки лога.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия
      description: Из `application/config/version` или вывод SimRunner `version`.
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Game.Core
        - Game.SimRunner
        - Godot / UI
        - Контент / JSON
        - Сборка / тесты
        - Документация
        - Другое

  - type: textarea
    id: logs
    attributes:
      label: Логи и окружение
      description: ОС, .NET SDK, версия Godot (если применимо), наличие модов.
      render: text
